# verified ABSENCE. Emitting a WellKnown or SecurityTxt pointer would assert a surface Clerk.io does not
# serve. Same reasoning for AgentCard (no card found), Security (no security.txt, no bug bounty, no
# disclosure page), Deprecation (no policy published), Idempotency (no mechanism published), ChangeLog
