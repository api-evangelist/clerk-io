description: >-
  Clerk.io is an e-commerce personalization platform that uses artificial intelligence and machine learning to deliver
  tailored product recommendations, on-site search results, audience-segmented email campaigns, and merchandising
  controls for online retailers. The platform exposes a REST API for product, category, order, and customer data
  ingestion, plus client-side JavaScript and Liquid templating for recommendation slots and search experiences.
