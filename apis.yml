        type: Pagination
    description: >-
      The Clerk.io API provides REST endpoints for managing products, categories, orders, customers, recommendations,
      and search. The API uses a dual-key authentication model: a public key identifies the store and is used in
      browser-side requests, while a private key is required for sensitive operations and data ingestion. JSON is the
      primary payload format and SSL is required when sending the private key. Clerk.io publishes an OpenAPI 3.1.0
      definition of 65 paths and 101 operations through its ReadMe developer portal, covering catalog ingestion,
      search, twenty-five recommendation logics, behavioural logging, merchandising, audiences and GDPR privacy
      requests.
  - aid: clerk-io:clerkjs
    name: Clerk.js Client Library
    tags:
