        type: SourceCode
      - url: https://docs.clerk.io/docs/clerkjs-cdn
        type: CDN
      - url: components/clerk-io-components.yml
        type: Components
    description: >-
      Clerk.js is the browser-side JavaScript library for embedding Clerk.io recommendation slots, search, and email
      opens on a storefront, with Liquid templating support and event tracking.
