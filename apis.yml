# NOTE: well-known/clerk-io-well-known.yml is deliberately NOT wired to a common[] pointer.
# Every /.well-known/ path on every Clerk.io host returned 404 on 2026-08-13, so the artifact records a
# verified ABSENCE. Emitting a WellKnown or SecurityTxt pointer would assert a surface Clerk.io does not
# serve. Same reasoning for AgentCard (no card found), Security (no security.txt, no bug bounty, no
# disclosure page), Deprecation (no policy published), Idempotency (no mechanism published), ChangeLog
# (ReadMe changelog is live but publishes zero entries), AsyncAPI/Webhooks (no event surface exists),
# Postman (the postman.com/clerk-io workspace is published by postman-atlas, not by Clerk.io), Roadmap
# (404) and Sandbox/CLI (neither exists).
