description: >-
  Clerk.io's published plans and pricing, read from https://www.clerk.io/pricing on 2026-08-13. This file
  REPLACES a fabricated Free/Professional/Enterprise scaffold written by the 2026-05-04 bulk sweep, whose
  tier names, quotas (1,000 and 100,000 requests/month) and rate limits (10 and 100 req/min) were
  invented and appear nowhere in Clerk.io's material.
pricing_model:
  type: modular-usage-based
  description: >-
    Clerk.io does not sell named subscription tiers. It sells five products a la carte - Search,
    Recommendations, Chat, Email and Audience - each metered on its own usage unit, each priced by a
    volume band selected in an interactive calculator. A customer buys any subset and can add products
    at any time. Clerk.io states "you only pay for the amount you use".
  billing_period: month
  currencies: [EUR, USD, GBP, DKK]
  currency_selectable: true
  quote_required_above_top_band: true
  price_transparency: calculator-only
  price_transparency_note: >-
    PRICES ARE NOT MACHINE-READABLE. The per-band monthly price and the per-1,000-unit rate are computed
    client-side by a JavaScript calculator; the served HTML carries 0 for every price and exposes no JSON
    price feed. The volume BANDS below are published in the page markup and are recorded verbatim; the
    amounts are not, and are deliberately left unstated here rather than guessed.
plan_count: 5
plans:
  - id: clerk-io-search
    name: Search
    type: usage
    description: Behaviour-based product search engine.
    metric: monthly searches
    bands: [10000, 25000, 50000, 75000, 100000, 150000, 200000, 250000, 500000, 750000, 1000000, 1500000, 2000000, 2500000]
    band_unit: searches/month
    above_top_band: contact for quote
    opt_out: 'No Search'
    price: not-published
    overage_unit: per 1,000 usage
    overage_price: not-published
  - id: clerk-io-recommendations
    name: Recommendations
    type: usage
    description: Product recommendations across storefront touchpoints.
    metric: monthly recommendations
    bands: [100000, 250000, 500000, 750000, 1000000, 1500000, 2000000, 2500000, 5000000, 7500000, 10000000]
    band_unit: recommendations/month
    above_top_band: contact for quote
    opt_out: 'No Recommendations'
    price: not-published
    overage_unit: per 1,000 usage
    overage_price: not-published
  - id: clerk-io-chat
    name: Chat
    type: usage
    description: Generative and predictive AI-powered chatbot.
    metric: monthly conversations
    bands: [100, 250, 500, 750, 1000, 1500, 2000, 2500, 5000, 7500, 10000, 15000, 20000, 25000]
    band_unit: conversations/month
    above_top_band: contact for quote
    opt_out: 'No Chat'
    price: not-published
    overage_unit: per 1,000 usage
    overage_price: not-published
  - id: clerk-io-email
    name: Email
    type: usage
    description: 1:1 personalised product emails.
    metric: monthly opened emails
    bands: [10000, 25000, 50000, 75000, 100000, 150000, 200000, 250000, 500000, 750000, 1000000, 1500000, 2000000, 2500000]
    band_unit: opened emails/month
    above_top_band: contact for quote
    opt_out: 'No Email'
    price: not-published
    overage_unit: per 1,000 usage
    overage_price: not-published
    note: Metered on emails OPENED, not emails sent.
  - id: clerk-io-audience
    name: Audience
    type: usage
    description: Audience segmentation and growth.
    metric: monthly active subscribers
    bands: [10000, 25000, 50000, 75000, 100000, 150000, 200000, 250000, 500000, 750000, 1000000, 1500000, 2000000, 2500000]
    band_unit: active subscribers/month
    above_top_band: contact for quote
    opt_out: 'No Audience'
    price: not-published
    overage_unit: per 1,000 usage
    overage_price: not-published
api_access:
  gated_by_plan: false
  note: >-
    The REST API is not sold as a separate line item and is not tiered. Any store gets a public and a
    private API key; API usage is metered through whichever products the store bought (a /search/search
    call consumes a Search unit, a /recommendations/* call consumes a Recommendations unit). There is no
    published free API tier and no published request quota or rate limit attached to any plan.
trial:
  available: true
  url: https://www.clerk.io/free-trial
  terms_published: false
