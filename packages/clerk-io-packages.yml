source: >-
  https://github.com/clerkio (org listing + releases/tags API), https://packagist.org,
  https://registry.npmjs.org, https://pypi.org, https://docs.clerk.io/docs/clerkjs-cdn
note: >-
  Clerk.io ships NO general-purpose language SDK for the api.clerk.io REST API - there is no first-party
  package on npm, PyPI, Maven Central, NuGet, RubyGems, crates.io or pkg.go.dev. What it ships instead is
  a browser library distributed by CDN (Clerk.js) and a set of first-party e-commerce PLATFORM EXTENSIONS
  maintained in the clerkio GitHub org. Those extensions are the supported integration path and are
  counted here as official client libraries. CAUTION FOR RE-RUNS: the npm scope @clerk and the Packagist
  vendor clerkinc belong to Clerk.com, an unrelated authentication company - they are NOT Clerk.io and
  must never be attributed here. @types/clerk.io on npm is a DefinitelyTyped community package, not
  first-party.
