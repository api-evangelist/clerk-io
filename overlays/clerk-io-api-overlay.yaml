info:
  title: API Evangelist enhancements for the Clerk.io API
  version: 1.0.0
extends: openapi/_original/clerk-io-api-settings-openapi-original.yml
x-provenance:
  generated: '2026-08-13'
  method: generated
  source: diff of openapi/clerk-io-openapi.yml against openapi/_original/clerk-io-api-settings-openapi-original.yml
  note: Records exactly what API Evangelist added to Clerk.io's published OpenAPI. The provider spec carries no document description,
    no contact, and no tags at all - 101 untagged operations in a single flat list. Applying this overlay to the verbatim
    original reproduces openapi/clerk-io-openapi.yml. No operation semantics, parameters, schemas or responses are altered.
actions:
- target: $.info
  description: API Evangelist replaced the ReadMe API Designer working title "api-settings" with the product name and added
    a substantive description and a docs contact.
  update:
    title: Clerk.io API
    description: 'Clerk.io e-commerce personalisation REST API. Ingest and manage catalog data (products, categories, pages,
      orders, order parcels, customers, accessories), run behaviour-ranked search and predictive search-as-you-type, request
      recommendation logics (popular, trending, new, complementary, substituting, visitor- and customer-personalised, category-
      and page-scoped), manage merchandising (custom search configurations, synonyms, redirects), drive audiences/campaigns/subscribers
      for email, log visitor behaviour events, and service GDPR privacy requests.


      All endpoints live under https://api.clerk.io/v2. Authentication uses a dual-key model: the public `key` identifies
      the store and is safe in browser-side calls; `private_key` is additionally required for write and sensitive operations
      and MUST only be sent over SSL.'
    contact:
      name: Clerk.io Documentation
      url: https://docs.clerk.io/
