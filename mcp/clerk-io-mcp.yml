  note: >-
    Clerk.io serves a remote MCP endpoint on its own documentation host, docs.clerk.io. A plain GET
    returns the plaintext body "This URL can only be accessed with a MCP client." A JSON-RPC POST of
    either `initialize` or `tools/list` returns HTTP 401 with
    {"jsonrpc":"2.0","error":{"code":-32001,"message":"Authorization required"},"id":null}, so the live
    tool list and its inputSchemas could not be enumerated anonymously. The endpoint is provisioned by
    ReadMe, Clerk.io's documentation platform, and is scoped to the documentation corpus - it is not a
    Model Context Protocol wrapper over the api.clerk.io REST surface. No /.well-known/
    oauth-protected-resource or /.well-known/oauth-authorization-server document is served on
    docs.clerk.io, so the authorization scheme is undiscoverable without credentials.
